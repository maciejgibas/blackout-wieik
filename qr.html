<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kod QR gry</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #040a14; --text: #e8f4ff; --muted: #93abc6; --cyan: #2de2ff; --line: rgba(90,200,255,.45); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; padding: 24px 16px; }
    main { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; text-align: center; }
    h1 { margin: 0; font-size: 28px; letter-spacing: .02em; }
    h1 span { color: var(--cyan); }
    p { margin: 0; color: var(--muted); }
    label { display: flex; flex-direction: column; gap: 6px; text-align: left; font-size: 13px; color: var(--muted); }
    input { min-height: 48px; border-radius: 12px; border: 0; padding: 10px 12px; font-size: 15px; background: #0b1729; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); }
    .qr { background: #fff; border-radius: 20px; padding: 18px; width: min(100%, 380px); margin: 0 auto; aspect-ratio: 1; display: grid; place-items: center; }
    .qr svg { width: 100%; height: auto; display: block; }
    .qr .err { color: #a0142c; font-size: 14px; }
    .cta { font-weight: 800; font-size: 20px; letter-spacing: .04em; }
    .row { display: flex; gap: 10px; }
    button { flex: 1; min-height: 48px; border-radius: 12px; border: 0; font-weight: 800; letter-spacing: .05em; cursor: pointer; background: linear-gradient(135deg, #5af0ff, var(--cyan) 35%, #3a7bff); color: #021022; }
    button.ghost { background: #0b1729; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); }
    @media print {
      body { background: #fff; color: #000; }
      label, .row, .hint { display: none !important; }
      h1 span { color: #0b2647; }
      .qr { box-shadow: 0 0 0 2px #0b2647; }
      p { color: #333; }
    }
  </style>
</head>
<body>
  <main>
    <h1><span>BLACKOUT:</span> URATUJ WIEiK</h1>
    <p class="cta">Zeskanuj i uruchom laboratorium!</p>
    <div class="qr" id="qr"></div>
    <p id="urlText"></p>
    <label>Adres gry (np. https://twoja-domena.pl/blackout/)
      <input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false">
    </label>
    <div class="row">
      <button type="button" id="gen">ODŚWIEŻ KOD</button>
      <button type="button" class="ghost" onclick="window.print()">DRUKUJ</button>
    </div>
    <p class="hint">Narzędzie dla organizatorów. Domyślny adres pochodzi z pola <code>publicUrl</code> w config.js. Kod generowany jest lokalnie w przeglądarce.</p>
  </main>

  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script>
    (function () {
      var C = window.BW_CONFIG || {};
      var input = document.getElementById("url");
      var box = document.getElementById("qr");
      var txt = document.getElementById("urlText");
      var guess = location.href.replace(/qr\.html.*$/, "");
      input.value = C.publicUrl || (location.protocol.indexOf("http") === 0 ? guess : "");
      function render() {
        var url = input.value.trim();
        txt.textContent = url;
        if (!url) { box.innerHTML = '<span class="err">Wpisz adres gry.</span>'; return; }
        if (typeof window.qrcode !== "function") {
          box.innerHTML = '<span class="err">Nie udało się wczytać generatora QR (brak internetu?). Spróbuj ponownie po połączeniu z siecią.</span>';
          return;
        }
        try {
          var qr = window.qrcode(0, "M");
          qr.addData(url);
          qr.make();
          box.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
        } catch (e) {
          box.innerHTML = '<span class="err">Nie udało się wygenerować kodu: adres jest zbyt długi?</span>';
        }
      }
      document.getElementById("gen").addEventListener("click", render);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") render(); });
      render();
    })();
  </script>
</body>
</html>
